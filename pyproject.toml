[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-fastapi-backend"
version = "1.0.0"
description = "Enterprise Production-Ready FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Enterprise Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -W ignore::DeprecationWarning"
pythonpath = ["."]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade (enforce modern Python 3.12 syntax)
    "B",      # flake8-bugbear
    "ASYNC",  # flake8-async
    "RUF",    # Ruff-specific rules
    "N",      # pep8-naming
]
ignore = []

